<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="诺瓦科技&嗨动科技 产品培训考核系统">
<title>诺瓦&嗨动 产品培训考核系统</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}
:root{
--primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;
--nova:#dc2626;--nova-light:#fee2e2;
--haidong:#2563eb;--haidong-light:#dbeafe;
--bg:#f1f5f9;--card:#fff;--text:#0f172a;--text-sec:#64748b;
--border:#e2e8f0;--success:#16a34a;--success-light:#dcfce7;
--warning:#d97706;--warning-light:#fef3c7;--danger:#dc2626;--danger-light:#fee2e2;
--shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
--radius:12px;--radius-sm:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
#app{min-height:100vh}
a{color:var(--primary);text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.9}
.btn-success{background:var(--success);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-lg{padding:14px 32px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-success{background:var(--success-light);color:var(--success)}
.badge-warning{background:var(--warning-light);color:var(--warning)}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-info{background:var(--primary-light);color:var(--primary)}
.badge-gray{background:#f1f5f9;color:var(--text-sec)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--text)}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;transition:border-color .2s;background:#fff;color:var(--text)}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary)}
.form-textarea{resize:vertical;min-height:80px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;padding:10px 12px;background:#f8fafc;border-bottom:2px solid var(--border);font-weight:600;white-space:nowrap}
.table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.table tr:hover{background:#f8fafc}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 18px;font-size:14px;font-weight:600;color:var(--text-sec);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--primary)}
.progress{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.progress-bar{height:100%;background:var(--primary);border-radius:4px;transition:width .3s}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;z-index:9999;animation:slideIn .3s ease;box-shadow:var(--shadow-lg)}
.toast-success{background:var(--success);color:#fff}
.toast-error{background:var(--danger);color:#fff}
.toast-info{background:var(--primary);color:#fff}
@keyframes slideIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .3s ease}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:#fff;border-radius:var(--radius);max-width:500px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px;font-weight:700}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.container{max-width:900px;margin:0 auto;padding:16px}
.header{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);color:#fff;padding:20px 16px;box-shadow:var(--shadow)}
.header h1{font-size:20px;font-weight:700}
.header p{font-size:13px;opacity:.9;margin-top:4px}
.nav-bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav-back{color:#fff;opacity:.9;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:4px}
.nav-back:hover{opacity:1}
.home-hero{text-align:center;padding:40px 20px}
.home-hero h1{font-size:26px;font-weight:800;margin-bottom:8px}
.home-hero p{font-size:14px;color:var(--text-sec);margin-bottom:24px}
.brand-tags{display:flex;justify-content:center;gap:12px;margin-bottom:24px}
.brand-tag{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600}
.brand-tag.nova{background:var(--nova-light);color:var(--nova)}
.brand-tag.haidong{background:var(--haidong-light);color:var(--haidong)}
.home-actions{display:flex;flex-direction:column;gap:12px;max-width:300px;margin:0 auto}
.qr-section{text-align:center;padding:20px}
.qr-section img,.qr-section canvas{margin:0 auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
.exam-list{display:flex;flex-direction:column;gap:12px}
.exam-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.exam-item:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.exam-item-info{flex:1}
.exam-item-title{font-size:15px;font-weight:600}
.exam-item-desc{font-size:12px;color:var(--text-sec);margin-top:2px}
.exam-item-meta{display:flex;align-items:center;gap:8px}
.quiz-header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;z-index:100;box-shadow:var(--shadow)}
.quiz-timer{font-size:18px;font-weight:700;color:var(--danger)}
.quiz-progress{font-size:13px;color:var(--text-sec)}
.question-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.question-type{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:600;margin-bottom:8px}
.question-type.single{background:#dbeafe;color:#1e40af}
.question-type.multiple{background:#fce7f3;color:#9d174d}
.question-type.judge{background:#d1fae5;color:#065f46}
.question-type.short{background:#fef3c7;color:#92400e}
.question-text{font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.7}
.question-options{display:flex;flex-direction:column;gap:8px}
.option-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s}
.option-item:hover{border-color:var(--primary);background:var(--primary-light)}
.option-item.selected{border-color:var(--primary);background:var(--primary-light)}
.option-radio{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.option-item.selected .option-radio{border-color:var(--primary)}
.option-item.selected .option-radio::after{content:'';width:10px;height:10px;background:var(--primary);border-radius:50%}
.option-checkbox{width:20px;height:20px;border:2px solid var(--border);border-radius:4px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.option-item.selected .option-checkbox{border-color:var(--primary);background:var(--primary)}
.option-item.selected .option-checkbox::after{content:'✓';color:#fff;font-size:14px;font-weight:700}
.option-text{flex:1;font-size:14px}
.judge-btns{display:flex;gap:12px}
.judge-btn{flex:1;padding:14px;border:2px solid var(--border);border-radius:var(--radius-sm);text-align:center;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s}
.judge-btn:hover{border-color:var(--primary)}
.judge-btn.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.short-answer{width:100%;min-height:120px;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;resize:vertical;font-family:inherit}
.short-answer:focus{outline:none;border-color:var(--primary)}
.score-display{text-align:center;padding:30px 20px}
.score-number{font-size:56px;font-weight:800;line-height:1}
.score-label{font-size:14px;color:var(--text-sec);margin-top:4px}
.score-status{font-size:20px;font-weight:700;margin-top:16px}
.score-pass{color:var(--success)}
.score-fail{color:var(--danger)}
.score-breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.score-item{background:#f8fafc;border-radius:var(--radius-sm);padding:12px;text-align:center}
.score-item-label{font-size:12px;color:var(--text-sec)}
.score-item-value{font-size:18px;font-weight:700;margin-top:4px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:center}
.stat-value{font-size:28px;font-weight:800;line-height:1}
.stat-label{font-size:12px;color:var(--text-sec);margin-top:4px}
.week-section{margin-bottom:24px}
.week-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.day-card{background:#fff;border-radius:var(--radius-sm);border:1px solid var(--border);padding:14px;margin-bottom:8px}
.day-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.day-card-title{font-size:14px;font-weight:600}
.session-item{display:flex;gap:8px;padding:6px 0;font-size:13px;border-top:1px dashed var(--border)}
.session-time{color:var(--text-sec);min-width:50px;font-weight:600}
.session-content{flex:1}
.session-points{color:var(--text-sec);font-size:12px;margin-top:2px}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{width:120px;font-size:13px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:24px;background:#f1f5f9;border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:12px;font-weight:600;transition:width .5s}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-sec)}
.empty-state-icon{font-size:48px;margin-bottom:12px}
.empty-state-text{font-size:14px}
.mentor-only{background:var(--warning-light);border:1px solid var(--warning);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;color:var(--warning);margin-bottom:12px}
.answer-detail{background:#f8fafc;border-radius:var(--radius-sm);padding:12px;margin-bottom:8px}
.answer-detail-q{font-size:14px;font-weight:600;margin-bottom:6px}
.answer-detail-a{font-size:13px;color:var(--text-sec)}
.answer-correct{color:var(--success);font-weight:600}
.answer-wrong{color:var(--danger);font-weight:600}
.scoring-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.scoring-question{font-size:14px;font-weight:600;margin-bottom:8px}
.scoring-answer{background:#f8fafc;padding:10px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:8px;max-height:150px;overflow-y:auto}
.scoring-keywords{font-size:12px;color:var(--text-sec);margin-bottom:8px}
.scoring-controls{display:flex;align-items:center;gap:8px}
.scoring-input{width:80px;padding:6px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;text-align:center}
.editable{outline:2px solid var(--primary-light);outline-offset:2px}
@media(max-width:640px){
.container{padding:12px}
.home-hero h1{font-size:22px}
.score-number{font-size:44px}
.stat-grid{grid-template-columns:repeat(2,1fr)}
.bar-label{width:80px;font-size:12px}
.table{font-size:12px}
.table th,.table td{padding:6px 8px}
.question-card{padding:14px}
.quiz-header{padding:10px 12px}
}

</style>

<div id="app"></div>
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

const Store = {
  getUser(){try{return JSON.parse(localStorage.getItem('quiz_user')||'null')}catch(e){return null}},
  setUser(u){localStorage.setItem('quiz_user',JSON.stringify(u))},
  clearUser(){localStorage.removeItem('quiz_user')},
  getRecords(){try{return JSON.parse(localStorage.getItem('quiz_records')||'[]')}catch(e){return[]}},
  saveRecord(r){const rs=this.getRecords();rs.push(r);localStorage.setItem('quiz_records',JSON.stringify(rs))},
  getRecord(id){return this.getRecords().find(r=>r.id===id)},
  updateRecord(id,updates){const rs=this.getRecords();const i=rs.findIndex(r=>r.id===id);if(i>=0){rs[i]={...rs[i],...updates};localStorage.setItem('quiz_records',JSON.stringify(rs))}},
  isMentor(){return localStorage.getItem('quiz_mentor')==='1'},
  setMentor(v){localStorage.setItem('quiz_mentor',v?'1':'0')},
  getPlan(){try{return JSON.parse(localStorage.getItem('quiz_plan')||'null')||DEFAULT_TRAINING_PLAN}catch(e){return DEFAULT_TRAINING_PLAN}},
  savePlan(p){localStorage.setItem('quiz_plan',JSON.stringify(p))},
  resetPlan(){localStorage.removeItem('quiz_plan')},
};

// ===== 工具函数 =====
function $(s){return document.querySelector(s)}
function escapeHtml(t){if(t==null)return'';return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function showToast(msg,type='info'){const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2500)}
function formatDate(d){const dt=new Date(d);return `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`}
function formatDuration(sec){const m=Math.floor(sec/60);const s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function genId(){return 'r_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}
function getQuestions(examId){return ALL_QUESTIONS.filter(q=>q.examId===examId)}
function getExam(id){return EXAMS.find(e=>e.id===id)}
function getTypeLabel(t){return {single:'单选题',multiple:'多选题',judge:'判断题',short:'简答题'}[t]||t}
function getTypeClass(t){return t}

function renderQRCode(){
  try {
    var url = window.location.href.split('#')[0];
    var qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    var cellSize = 4;
    var moduleCount = qr.getModuleCount();
    var canvas = document.createElement('canvas');
    canvas.width = moduleCount * cellSize;
    canvas.height = moduleCount * cellSize;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (var r = 0; r < moduleCount; r++) {
      for (var c = 0; c < moduleCount; c++) {
        if (qr.isDark(r, c)) {
          ctx.fillStyle = '#000';
          ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
        }
      }
    }
    var dataUrl = canvas.toDataURL('image/png');
    return '<div class="qr-section">' +
      '<img src="' + dataUrl + '" alt="扫码进入" width="180" height="180" style="border-radius:8px;border:1px solid var(--border)">' +
      '<p style="font-size:12px;color:var(--text-sec);margin-top:8px">扫码或分享链接进入答题</p>' +
      '<p style="font-size:11px;color:var(--text-sec);word-break:break-all;max-width:280px;margin:4px auto">' + escapeHtml(url) + '</p>' +
      '</div>';
  } catch(e) {
    var url2 = window.location.href.split('#')[0];
    return '<div class="qr-section"><p style="font-size:12px;color:var(--text-sec);margin-bottom:8px">复制以下链接分享：</p><p style="font-size:11px;word-break:break-all;max-width:280px;margin:0 auto;padding:8px;background:#f8fafc;border-radius:8px">' + escapeHtml(url2) + '</p></div>';
  }
}


// ===== 路由 =====
function navigate(route){window.location.hash=route}
function handleRoute(){
  const hash=window.location.hash||'#/';
  const parts=hash.replace(/^#\//,'').split('/');
  const app=$('#app');
  if(parts[0]===''||parts[0]===''){renderHome();return}
  if(parts[0]==='login'){renderStudentLogin();return}
  if(parts[0]==='exams'){if(!Store.getUser()){navigate('#/login');return}renderExamList();return}
  if(parts[0]==='quiz'){if(!Store.getUser()){navigate('#/login');return}renderQuiz(parts[1]);return}
  if(parts[0]==='result'){if(!Store.getUser()){navigate('#/login');return}renderResult(parts[1]);return}
  if(parts[0]==='learning'){if(!Store.getUser()){navigate('#/login');return}renderLearning();return}
  if(parts[0]==='mentor'){if(parts[1]){if(!Store.isMentor()){navigate('#/mentor');return}renderMentorDashboard(parts[1]);return}renderMentorLogin();return}
  renderHome();
}

// ===== 答题引擎 =====
let quizState=null;
let quizTimer=null;

function renderQuiz(examId){
  const exam=getExam(examId);
  if(!exam){showToast('考试不存在','error');navigate('#/exams');return}
  const questions=getQuestions(examId);
  if(questions.length===0){showToast('题目加载失败','error');navigate('#/exams');return}
  
  // 初始化答题状态
  const answers={};
  questions.forEach(q=>{
    if(q.type==='multiple')answers[q.id]=[];
    else if(q.type==='judge')answers[q.id]=null;
    else answers[q.id]='';
  });
  
  quizState={examId,questions,answers,startTime:Date.now(),duration:exam.duration*60};
  
  $('#app').innerHTML=`
    <div class="quiz-header" id="quizHeader">
      <div class="nav-bar">
        <span class="nav-back" onclick="confirmExitQuiz()">← 退出</span>
        <span style="font-size:14px;font-weight:600">${escapeHtml(exam.title)}</span>
        <span class="quiz-timer" id="quizTimer">⏱ ${formatDuration(exam.duration*60)}</span>
      </div>
      <div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center">
        <span class="quiz-progress" id="quizProgress">已答 0 / ${questions.length}</span>
        <button class="btn btn-success btn-sm" onclick="confirmSubmit()">提交试卷</button>
      </div>
    </div>
    <div class="container" style="padding-top:80px">
      <div style="background:var(--primary-light);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--primary)">
        📋 本试卷共${questions.length}道题（8单选+4多选+4判断+2简答），满分100分，及格线${CONFIG.passingScore}分。考试时长${exam.duration}分钟，请合理安排时间。
      </div>
      ${questions.map((q,i)=>renderQuestionHTML(q,i)).join('')}
      <div style="text-align:center;padding:20px 0 40px">
        <button class="btn btn-success btn-lg" onclick="confirmSubmit()">提交试卷</button>
      </div>
    </div>`;
  
  startQuizTimer();
  updateQuizProgress();
}

function renderQuestionHTML(q,index){
  const typeLabel=getTypeLabel(q.type);
  const typeClass=getTypeClass(q.type);
  let optionsHTML='';
  if(q.type==='single'){
    optionsHTML=`<div class="question-options">${q.options.map((opt,i)=>{
      const letter=String.fromCharCode(65+i);
      return `<div class="option-item" onclick="selectSingle('${q.id}','${letter}',this)">
        <div class="option-radio"></div><div class="option-text">${escapeHtml(opt)}</div>
      </div>`;
    }).join('')}</div>`;
  }else if(q.type==='multiple'){
    optionsHTML=`<div class="question-options">${q.options.map((opt,i)=>{
      const letter=String.fromCharCode(65+i);
      return `<div class="option-item" onclick="toggleMultiple('${q.id}','${letter}',this)">
        <div class="option-checkbox"></div><div class="option-text">${escapeHtml(opt)}</div>
      </div>`;
    }).join('')}</div>
    <p style="font-size:12px;color:var(--text-sec);margin-top:6px">（多选题，可选择多个选项）</p>`;
  }else if(q.type==='judge'){
    optionsHTML=`<div class="judge-btns">
      <div class="judge-btn" onclick="selectJudge('${q.id}',true,this)">✓ 正确</div>
      <div class="judge-btn" onclick="selectJudge('${q.id}',false,this)">✗ 错误</div>
    </div>`;
  }else if(q.type==='short'){
    optionsHTML=`<textarea class="short-answer" placeholder="请在此输入您的答案..." oninput="quizState.answers['${q.id}']=this.value"></textarea>
    <p style="font-size:12px;color:var(--text-sec);margin-top:6px">（简答题，请详细作答）</p>`;
  }
  return `<div class="question-card" id="q_${q.id}">
    <span class="question-type ${typeClass}">${typeLabel} ${q.points}分</span>
    <span style="font-size:12px;color:var(--text-sec);margin-left:8px">第${index+1}题</span>
    <div class="question-text">${index+1}. ${escapeHtml(q.question)}</div>
    ${optionsHTML}
  </div>`;
}

function selectSingle(qId,letter,el){
  quizState.answers[qId]=letter;
  el.parentElement.querySelectorAll('.option-item').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  updateQuizProgress();
}
function toggleMultiple(qId,letter,el){
  let arr=quizState.answers[qId]||[];
  if(arr.includes(letter))arr=arr.filter(l=>l!==letter);
  else arr.push(letter);
  quizState.answers[qId]=arr;
  el.classList.toggle('selected');
  updateQuizProgress();
}
function selectJudge(qId,value,el){
  quizState.answers[qId]=value;
  el.parentElement.querySelectorAll('.judge-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  updateQuizProgress();
}
function updateQuizProgress(){
  if(!quizState)return;
  const answered=quizState.questions.filter(q=>{
    const a=quizState.answers[q.id];
    if(q.type==='multiple')return a&&a.length>0;
    if(q.type==='judge')return a!==null;
    return a&&a.trim();
  }).length;
  const el=$('#quizProgress');
  if(el)el.textContent=`已答 ${answered} / ${quizState.questions.length}`;
}
function startQuizTimer(){
  if(quizTimer)clearInterval(quizTimer);
  const endTime=Date.now()+quizState.duration*1000;
  quizTimer=setInterval(()=>{
    const remaining=Math.max(0,Math.floor((endTime-Date.now())/1000));
    const el=$('#quizTimer');
    if(el)el.textContent=`⏱ ${formatDuration(remaining)}`;
    if(remaining<=0){clearInterval(quizTimer);showToast('考试时间到，自动提交','warning');submitQuiz();}
  },1000);
}
function confirmExitQuiz(){
  if(confirm('确定要退出考试吗？已作答的内容将不会保存。')){
    if(quizTimer)clearInterval(quizTimer);
    quizState=null;
    navigate('#/exams');
  }
}
function confirmSubmit(){
  const unanswered=quizState.questions.filter(q=>{
    const a=quizState.answers[q.id];
    if(q.type==='multiple')return !a||a.length===0;
    if(q.type==='judge')return a===null;
    return !a||!a.trim();
  }).length;
  if(unanswered>0){
    if(!confirm(`还有${unanswered}道题未作答，确定要提交吗？`))return;
  }else{
    if(!confirm('确定要提交试卷吗？提交后不可修改。'))return;
  }
  submitQuiz();
}
function submitQuiz(){
  if(quizTimer)clearInterval(quizTimer);
  const{examId,questions,answers,startTime}=quizState;
  const user=Store.getUser();
  
  // 评分
  const questionScores={};
  let totalScore=0;
  let typeScores={single:{score:0,max:0},multiple:{score:0,max:0},judge:{score:0,max:0},short:{score:0,max:0}};
  
  questions.forEach(q=>{
    let score=0;
    const userAnswer=answers[q.id];
    if(q.type==='single'){
      score=userAnswer===q.answer?q.points:0;
    }else if(q.type==='multiple'){
      const ua=Array.isArray(userAnswer)?userAnswer.sort():[];
      const ca=Array.isArray(q.answer)?q.answer.sort():[];
      score=JSON.stringify(ua)===JSON.stringify(ca)?q.points:0;
    }else if(q.type==='judge'){
      score=userAnswer===q.answer?q.points:0;
    }else if(q.type==='short'){
      score=gradeShortAnswer(userAnswer,q.answer);
    }
    questionScores[q.id]={score,maxScore:q.points};
    totalScore+=score;
    typeScores[q.type].score+=score;
    typeScores[q.type].max+=q.points;
  });
  
  const hasShort=questions.some(q=>q.type==='short');
  const record={
    id:genId(),studentName:user.name,examId,examTitle:getExam(examId).title,
    answers:{...answers},questionScores,autoScore:totalScore,mentorScore:null,
    finalScore:totalScore,passed:totalScore>=CONFIG.passingScore,
    startTime:new Date(startTime).toISOString(),submitTime:new Date().toISOString(),
    duration:Math.round((Date.now()-startTime)/1000),
    typeScores,mentorScored:false,mentorScoreDetails:null,
  };
  Store.saveRecord(record);
  quizState=null;
  showToast(`提交成功！得分：${totalScore}分`,totalScore>=CONFIG.passingScore?'success':'error');
  navigate(`#/result/${record.id}`);
}

function gradeShortAnswer(answer,keywords){
  if(!answer||!answer.trim())return 0;
  const ks=keywords.split(',').map(k=>k.trim().toLowerCase()).filter(k=>k);
  if(ks.length===0)return 5;
  const al=answer.toLowerCase();
  let matched=0;
  ks.forEach(k=>{if(al.includes(k))matched++});
  return Math.round((matched/ks.length)*10);
}

          const sr=records.filter(r=>r.studentName===name);
          const best=sr.reduce((max,r)=>Math.max(max,r.finalScore),0);

          return `<tr>

function viewRecordDetail(recordId){
  const r=Store.getRecord(recordId);
  if(!r)return;
  const questions=getQuestions(r.examId);
  const exam=getExam(r.examId);
  
  const modal=document.createElement('div');
  modal.className='modal-overlay';
  modal.onclick=e=>{if(e.target===modal)modal.remove()};
  modal.innerHTML=`<div class="modal" style="max-width:700px">
    <div class="modal-header">答题详情 — ${escapeHtml(r.studentName)} · ${escapeHtml(r.examTitle)} · ${r.finalScore}分</div>
    <div class="modal-body" style="max-height:60vh;overflow-y:auto">
      <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
        <span class="badge ${r.passed?'badge-success':'badge-danger'}">${r.passed?'及格':'未及格'} ${r.finalScore}分</span>
        <span class="badge badge-gray">用时 ${formatDuration(r.duration)}</span>
        <span class="badge badge-gray">${formatDate(r.submitTime)}</span>
        ${r.mentorScored?'<span class="badge badge-info">导师已评分</span>':''}
      </div>
      ${questions.map((q,i)=>{
        const ua=r.answers[q.id];
        const qs=r.questionScores[q.id]||{score:0,maxScore:q.points};
        let userAnswerText='';
        let correctAnswerText='';
        if(q.type==='single'){userAnswerText=ua?(q.options[ua.charCodeAt(0)-65]||ua):'未作答';correctAnswerText=q.options[(q.answer||'A').charCodeAt(0)-65]||q.answer||''}
        else if(q.type==='multiple'){userAnswerText=Array.isArray(ua)&&ua.length?ua.map(l=>q.options[l.charCodeAt(0)-65]||l).join('、'):'未作答';correctAnswerText=(Array.isArray(q.answer)?q.answer:[]).map(l=>q.options[l.charCodeAt(0)-65]||l).join('、')}
        else if(q.type==='judge'){userAnswerText=ua===null||ua===undefined?'未作答':(ua?'正确':'错误');correctAnswerText=q.answer?'正确':'错误'}
        else if(q.type==='short'){userAnswerText=ua||'未作答';correctAnswerText=String(q.answer||'').split(',').join('、')}
        const isCorrect=qs.score>=qs.maxScore;
        return `<div class="answer-detail">
          <div class="answer-detail-q">${i+1}. [${getTypeLabel(q.type)} ${q.points}分] ${escapeHtml(q.question)}</div>
          <div style="margin:6px 0"><b>学员答案：</b><span class="${isCorrect?'answer-correct':'answer-wrong'}">${escapeHtml(userAnswerText)}</span> <span style="color:var(--text-sec)">(${qs.score}/${qs.maxScore}分)</span></div>
          ${q.type!=='short'?`<div style="margin:4px 0"><b>正确答案：</b><span class="answer-correct">${escapeHtml(correctAnswerText)}</span></div>`:`<div style="margin:4px 0"><b>评分关键词：</b><span style="color:var(--text-sec)">${escapeHtml(correctAnswerText)}</span></div>`}
          <div style="margin:4px 0;font-size:13px;color:var(--text-sec)"><b>解析：</b>${escapeHtml(q.explanation)}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">关闭</button>
      <button class="btn btn-primary" onclick="this.closest('.modal-overlay').remove();navigate('#/mentor/scoring')">去评分</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

// ===== 题库管理 =====
function renderMentorQuestionBank(){
  let filterExam=window._qbFilterExam||'';
  let filterType=window._qbFilterType||'';
  let searchTerm=window._qbSearch||'';
  
  let questions=ALL_QUESTIONS.slice();
  if(filterExam)questions=questions.filter(q=>q.examId===filterExam);
  if(filterType)questions=questions.filter(q=>q.type===filterType);
  if(searchTerm)questions=questions.filter(q=>(q.question||'').includes(searchTerm)||(q.knowledgePoint||'').includes(searchTerm));
  
  $('#mentorContent').innerHTML=`
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:12px">题库浏览（共${ALL_QUESTIONS.length}道题）</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <select class="form-select" style="width:auto" onchange="window._qbFilterExam=this.value;renderMentorQuestionBank()">
          <option value="">全部考试</option>
          ${EXAMS.map(e=>`<option value="${e.id}" ${filterExam===e.id?'selected':''}>${escapeHtml(e.title)} - ${escapeHtml(e.desc)}</option>`).join('')}
        </select>
        <select class="form-select" style="width:auto" onchange="window._qbFilterType=this.value;renderMentorQuestionBank()">
          <option value="">全部题型</option>
          <option value="single" ${filterType==='single'?'selected':''}>单选题</option>
          <option value="multiple" ${filterType==='multiple'?'selected':''}>多选题</option>
          <option value="judge" ${filterType==='judge'?'selected':''}>判断题</option>
          <option value="short" ${filterType==='short'?'selected':''}>简答题</option>
        </select>
        <input type="text" class="form-input" style="width:200px" placeholder="搜索题目..." value="${escapeHtml(searchTerm)}" oninput="window._qbSearch=this.value" onkeydown="if(event.key==='Enter')renderMentorQuestionBank()">
        <button class="btn btn-outline btn-sm" onclick="window._qbFilterExam='';window._qbFilterType='';window._qbSearch='';renderMentorQuestionBank()">重置</button>
      </div>
      <p style="font-size:13px;color:var(--text-sec)">当前显示 ${questions.length} 道题</p>
    </div>
    ${questions.map((q,i)=>{
      const exam=getExam(q.examId);
      let answerText='';
      if(q.type==='single')answerText=q.options[q.answer.charCodeAt(0)-65]||q.answer||'';
      else if(q.type==='multiple')answerText=(Array.isArray(q.answer)?q.answer:[]).map(l=>q.options[l.charCodeAt(0)-65]||l).join('、');
      else if(q.type==='judge')answerText=q.answer?'正确':'错误';
      else if(q.type==='short')answerText=String(q.answer||'').split(',').join('、');
      return `<div class="question-card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span class="question-type ${q.type}">${getTypeLabel(q.type)} ${q.points}分</span>
          <span class="badge badge-gray">${escapeHtml(exam?.title||q.examId)}</span>
          <span style="font-size:12px;color:var(--text-sec)">${escapeHtml(q.knowledgePoint)}</span>
        </div>
        <div class="question-text">${i+1}. ${escapeHtml(q.question)}</div>
        ${(q.options&&q.options.length>0)?`<div class="question-options" style="pointer-events:none">${q.options.map((opt,j)=>{
          const letter=String.fromCharCode(65+j);
          const isAnswer=q.type==='single'?q.answer===letter:(q.type==='multiple'&&q.answer.includes(letter));
          return `<div class="option-item ${isAnswer?'selected':''}"><div class="${q.type==='multiple'?'option-checkbox':'option-radio'}"></div><div class="option-text">${escapeHtml(opt)}</div></div>`;
        }).join('')}</div>`:''}
        ${q.type==='judge'?`<div style="padding:8px 12px;background:#f8fafc;border-radius:var(--radius-sm);font-size:14px"><b>正确答案：</b><span class="answer-correct">${answerText}</span></div>`:''}
        ${q.type==='short'?`<div style="padding:8px 12px;background:#fef3c7;border-radius:var(--radius-sm);font-size:13px"><b>评分关键词：</b>${escapeHtml(answerText)}</div>`:''}
        <div style="margin-top:8px;padding:8px 12px;background:#f0fdf4;border-radius:var(--radius-sm);font-size:13px;color:#166534"><b>解析：</b>${escapeHtml(q.explanation)}</div>
      </div>`;
    }).join('')}
  `;
}

function toggleEditMode(){
  window._editMode=!window._editMode;
  if(!window._editMode){
    showToast('已保存修改','success');
  }
  renderMentorTrainingPlan();
}
function savePlanEdit(wi,di,si,field,value){
  const plan=Store.getPlan();
  if(plan[wi]&&plan[wi].days[di]&&plan[wi].days[di].sessions[si]){
    plan[wi].days[di].sessions[si][field]=value.trim();
    Store.savePlan(plan);
  }
}
function resetTrainingPlan(){
  if(!confirm('确定要恢复默认培训计划吗？所有自定义修改将丢失。'))return;
  Store.resetPlan();
  showToast('已恢复默认','success');
  renderMentorTrainingPlan();
}

            <td>${r.autoScore}</td><td>${r.mentorScore||'-'}</td>
            <td><b style="color:${r.passed?'var(--success)':'var(--danger)'}">${r.finalScore}</b></td>
            <td><button class="btn btn-outline btn-sm" onclick="resetMentorScore('${r.id}')">重新评分</button></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    `:''}
    
    ${recordsWithShort.length===0?'<div class="empty-state"><div class="empty-state-icon">✏️</div><div class="empty-state-text">暂无需要评分的记录</div></div>':''}
  `;
}

function saveMentorScore(recordId){
  const r=Store.getRecord(recordId);
  if(!r)return;
  const questions=getQuestions(r.examId).filter(q=>q.type==='short');
  let mentorScoreDetails={};
  let totalScore=r.autoScore;
  // 减去简答自动评分，加上导师评分
  questions.forEach(q=>{
    const oldScore=r.questionScores[q.id]?.score||0;
    const input=$(`#score_${recordId}_${q.id}`);
    const newScore=Math.max(0,Math.min(q.points,parseFloat(input?.value||0)));
    mentorScoreDetails[q.id]={autoScore:oldScore,mentorScore:newScore};
    totalScore=totalScore-oldScore+newScore;
    r.questionScores[q.id]={score:newScore,maxScore:q.points};
  });
  // 更新typeScores
  let shortScore=0,shortMax=0;
  questions.forEach(q=>{
    shortScore+=r.questionScores[q.id].score;
    shortMax+=q.points;
  });
  r.typeScores.short={score:shortScore,max:shortMax};
  
  Store.updateRecord(recordId,{
    mentorScore:totalScore,
    finalScore:totalScore,
    passed:totalScore>=CONFIG.passingScore,
    mentorScored:true,
    mentorScoreDetails,
  });
  showToast(`评分已保存，最终分数：${totalScore}分`,'success');
  renderMentorScoring();
}

function resetMentorScore(recordId){
  if(!confirm('确定要重新评分吗？之前的导师评分将被清除。'))return;
  const r=Store.getRecord(recordId);
  if(!r)return;
  // 恢复自动评分
  const questions=getQuestions(r.examId).filter(q=>q.type==='short');
  let shortScore=0,shortMax=0;
  questions.forEach(q=>{
    const autoScore=gradeShortAnswer(r.answers[q.id],q.answer);
    r.questionScores[q.id]={score:autoScore,maxScore:q.points};
    shortScore+=autoScore;
    shortMax+=q.points;
  });
  r.typeScores.short={score:shortScore,max:shortMax};
  // 重新计算总分
  let total=0;
  Object.values(r.questionScores).forEach(qs=>total+=qs.score);
  Store.updateRecord(recordId,{
    autoScore:total,
    mentorScore:null,
    finalScore:total,
    passed:total>=CONFIG.passingScore,
    mentorScored:false,
    mentorScoreDetails:null,
  });
  showToast('已重置为自动评分','info');
  renderMentorScoring();
}

// ===== 初始化 =====
function init(){
  window.addEventListener('hashchange',handleRoute);
  handleRoute();
}
window.addEventListener('DOMContentLoaded',init);

</script>
